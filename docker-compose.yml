services:
  chroma:
    image: chromadb/chroma:latest
    container_name: query-resolution-chroma
    # Port 6334 avoids clashing with other local Chroma servers on 6333.
    ports:
      - "6334:8000"
    volumes:
      - chroma-data:/data
      - ./docker/chroma-config.yaml:/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  chroma-data:
